<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>ScanSign • Document Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0c;
      --bg-elevated: rgba(28, 28, 32, 0.72);
      --glass: rgba(255, 255, 255, 0.08);
      --glass-strong: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.18);
      --text: #f5f5f7;
      --text-secondary: rgba(235, 235, 245, 0.6);
      --text-tertiary: rgba(235, 235, 245, 0.3);
      --accent: #0a84ff;
      --accent-soft: rgba(10, 132, 255, 0.25);
      --green: #30d158;
      --orange: #ff9f0a;
      --red: #ff453a;
      --radius: 20px;
      --radius-sm: 12px;
      --radius-lg: 28px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --blur: 40px;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overscroll-behavior: none;
    }

    /* Background ambient glow */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(10, 132, 255, 0.18), transparent 50%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(191, 90, 242, 0.12), transparent 50%),
        radial-gradient(ellipse 50% 30% at 50% 50%, rgba(48, 209, 88, 0.06), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    /* ========== LIQUID GLASS UTILITIES ========== */
    .glass {
      background: var(--glass);
      backdrop-filter: blur(var(--blur)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .glass-strong {
      background: var(--glass-strong);
      backdrop-filter: blur(calc(var(--blur) + 10px)) saturate(200%);
      -webkit-backdrop-filter: blur(calc(var(--blur) + 10px)) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    /* ========== STATUS BAR / NAV ========== */
    .top-bar {
      padding: calc(12px + var(--safe-top)) 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 20;
    }

    .top-bar h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.2s var(--spring), background 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.9);
      background: var(--glass-strong);
    }

    .icon-btn.primary {
      background: var(--accent);
      border-color: transparent;
      color: white;
    }

    /* ========== SCREENS ========== */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px) scale(0.98);
      transition: opacity 0.35s ease, transform 0.4s var(--spring);
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    /* ========== HOME ========== */
    #home {
      padding-bottom: calc(100px + var(--safe-bottom));
    }

    .hero {
      padding: 24px 24px 8px;
      text-align: center;
    }

    .hero .logo {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(145deg, #0a84ff, #5e5ce6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 34px;
      box-shadow: 0 12px 40px rgba(10, 132, 255, 0.4);
    }

    .hero h2 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.6px;
      margin-bottom: 6px;
    }

    .hero p {
      color: var(--text-secondary);
      font-size: 15px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 28px 20px;
    }

    .action-card {
      border-radius: var(--radius);
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.25s var(--spring);
      min-height: 130px;
    }

    .action-card:active {
      transform: scale(0.96);
    }

    .action-card .icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .action-card.scan .icon { background: var(--accent-soft); color: var(--accent); }
    .action-card.import .icon { background: rgba(48, 209, 88, 0.2); color: var(--green); }
    .action-card.sign .icon { background: rgba(255, 159, 10, 0.2); color: var(--orange); }
    .action-card.stamp .icon { background: rgba(191, 90, 242, 0.2); color: #bf5af2; }

    .action-card span {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .action-card small {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    /* ========== CAMERA / SCANNER ========== */
    #scanner {
      background: #000;
    }

    .camera-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scan-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scan-frame {
      width: min(86vw, 340px);
      aspect-ratio: 3/4;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    .scan-frame::before,
    .scan-frame::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      border: 3px solid var(--accent);
    }

    .scan-frame::before {
      top: -2px;
      left: -2px;
      border-right: none;
      border-bottom: none;
      border-radius: 12px 0 0 0;
    }

    .scan-frame::after {
      bottom: -2px;
      right: -2px;
      border-left: none;
      border-top: none;
      border-radius: 0 0 12px 0;
    }

    .camera-controls {
      padding: 20px 24px calc(28px + var(--safe-bottom));
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    }

    .capture-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 5px solid white;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .capture-btn:active { transform: scale(0.92); }

    .capture-btn::after {
      content: "";
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: white;
    }

    /* ========== EDITOR ========== */
    #editor {
      background: #111;
    }

    .editor-canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #mainCanvas {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      background: white;
    }

    .toolbar {
      padding: 12px 16px calc(16px + var(--safe-bottom));
      display: flex;
      gap: 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .toolbar::-webkit-scrollbar { display: none; }

    .tool {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: var(--glass);
      border: 1px solid transparent;
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 64px;
    }

    .tool:active, .tool.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .tool .t-icon {
      font-size: 22px;
      line-height: 1;
    }

    /* ========== MODALS ========== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      width: 100%;
      max-width: 500px;
      background: rgba(30, 30, 34, 0.92);
      backdrop-filter: blur(50px) saturate(180%);
      -webkit-backdrop-filter: blur(50px) saturate(180%);
      border-radius: 28px 28px 0 0;
      border: 1px solid var(--glass-border);
      border-bottom: none;
      padding: 12px 20px calc(28px + var(--safe-bottom));
      transform: translateY(100%);
      transition: transform 0.4s var(--spring);
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal-backdrop.open .sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 36px;
      height: 5px;
      border-radius: 3px;
      background: rgba(255,255,255,0.25);
      margin: 0 auto 16px;
    }

    .sheet h3 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }

    /* Signature pad */
    .sig-container {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
      touch-action: none;
    }

    #sigCanvas {
      width: 100%;
      height: 180px;
      display: block;
    }

    .sheet-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      height: 50px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active { transform: scale(0.97); }

    .btn-secondary {
      background: var(--glass-strong);
      color: var(--text);
      border: 1px solid var(--glass-border);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-danger {
      background: rgba(255, 69, 58, 0.2);
      color: var(--red);
    }

    /* Stamp grid */
    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stamp-item {
      aspect-ratio: 1;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 28px;
      transition: all 0.2s;
      overflow: hidden;
      position: relative;
    }

    .stamp-item:active, .stamp-item.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .stamp-item img {
      width: 70%;
      height: 70%;
      object-fit: contain;
    }

    .stamp-item .label {
      position: absolute;
      bottom: 4px;
      font-size: 9px;
      color: var(--text-secondary);
    }

    /* Floating action bar */
    .fab-bar {
      position: absolute;
      bottom: calc(90px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      padding: 8px;
      border-radius: 999px;
      z-index: 30;
    }

    .fab {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: none;
      cursor: pointer;
      color: white;
      transition: transform 0.2s var(--spring);
    }

    .fab:active { transform: scale(0.9); }

    .fab.done { background: var(--green); }
    .fab.export { background: var(--accent); }

    /* Toast */
    .toast {
      position: fixed;
      top: calc(20px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(30,30,34,0.9);
      backdrop-filter: blur(20px);
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s var(--spring);
      z-index: 200;
      border: 1px solid var(--glass-border);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Hidden file inputs */
    .hidden { display: none !important; }

    /* Loading */
    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(255,255,255,0.25);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty state */
    .empty-editor {
      color: var(--text-tertiary);
      text-align: center;
      padding: 40px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- HOME -->
    <section id="home" class="screen active">
      <div class="top-bar">
        <div style="width:40px"></div>
        <h1>ScanSign</h1>
        <button class="icon-btn" id="btnSettings" title="About">ⓘ</button>
      </div>

      <div class="hero">
        <div class="logo">📄</div>
        <h2>Scan & Sign</h2>
        <p>Capture documents, add signature & stamp</p>
      </div>

      <div class="action-grid">
        <div class="action-card glass scan" id="btnScan">
          <div class="icon">📷</div>
          <span>Scan</span>
          <small>Use camera to capture document</small>
        </div>
        <div class="action-card glass import" id="btnImport">
          <div class="icon">📁</div>
          <span>Import</span>
          <small>From photos or files</small>
        </div>
        <div class="action-card glass sign" id="btnQuickSign">
          <div class="icon">✍️</div>
          <span>Signature</span>
          <small>Create or manage signature</small>
        </div>
        <div class="action-card glass stamp" id="btnQuickStamp">
          <div class="icon">🔖</div>
          <span>Stamps</span>
          <small>Choose or upload stamp</small>
        </div>
      </div>
    </section>

    <!-- SCANNER -->
    <section id="scanner" class="screen">
      <div class="top-bar" style="position:absolute;width:100%;background:linear-gradient(to bottom,rgba(0,0,0,0.6),transparent);">
        <button class="icon-btn" id="btnCloseScanner">✕</button>
        <h1 style="color:white">Scan Document</h1>
        <button class="icon-btn" id="btnTorch" title="Flash">⚡</button>
      </div>
      <div class="camera-wrap">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-overlay">
          <div class="scan-frame"></div>
        </div>
      </div>
      <div class="camera-controls">
        <button class="icon-btn" id="btnGalleryFromCam" style="background:rgba(255,255,255,0.15)">🖼</button>
        <button class="capture-btn" id="btnCapture"></button>
        <button class="icon-btn" id="btnSwitchCam" style="background:rgba(255,255,255,0.15)">🔄</button>
      </div>
    </section>

    <!-- EDITOR -->
    <section id="editor" class="screen">
      <div class="top-bar">
        <button class="icon-btn" id="btnBackEditor">‹</button>
        <h1>Edit Document</h1>
        <button class="icon-btn primary" id="btnExport">↓</button>
      </div>

      <div class="editor-canvas-wrap" id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div class="empty-editor" id="emptyState">No document loaded</div>
      </div>

      <div class="toolbar glass" id="mainToolbar">
        <button class="tool" data-tool="signature">
          <span class="t-icon">✍️</span>
          Signature
        </button>
        <button class="tool" data-tool="stamp">
          <span class="t-icon">🔖</span>
          Stamp
        </button>
        <button class="tool" data-tool="text">
          <span class="t-icon">Aa</span>
          Text
        </button>
        <button class="tool" data-tool="rotate">
          <span class="t-icon">↻</span>
          Rotate
        </button>
        <button class="tool" data-tool="filter">
          <span class="t-icon">◐</span>
          Filter
        </button>
        <button class="tool" data-tool="delete">
          <span class="t-icon">⌫</span>
          Clear
        </button>
      </div>
    </section>
  </div>

  <!-- Signature Sheet -->
  <div class="modal-backdrop" id="sigModal">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>Draw Signature</h3>
      <div class="sig-container">
        <canvas id="sigCanvas"></canvas>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-secondary" id="btnClearSig">Clear</button>
        <button class="btn btn-primary" id="btnSaveSig">Use Signature</button>
      </div>
    </div>
  </div>

  <!-- Stamp Sheet -->
  <div class="modal-backdrop" id="stampModal">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>Choose Stamp</h3>
      <div class="stamp-grid" id="stampGrid">
        <!-- filled by JS -->
      </div>
      <div class="sheet-actions">
        <button class="btn btn-secondary" id="btnUploadStamp">Upload</button>
        <button class="btn btn-primary" id="btnPlaceStamp" disabled>Place Stamp</button>
      </div>
    </div>
  </div>

  <!-- Export Sheet -->
  <div class="modal-backdrop" id="exportModal">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>Export</h3>
      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:8px">
        <button class="btn btn-primary" id="btnExportPNG">Save as PNG</button>
        <button class="btn btn-primary" id="btnExportPDF" style="background:#30d158">Save as PDF</button>
        <button class="btn btn-secondary" id="btnShare" style="display:none">Share…</button>
      </div>
    </div>
  </div>

  <!-- Hidden inputs -->
  <input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden" />
  <input type="file" id="stampInput" accept="image/*" class="hidden" />

  <div class="toast" id="toast"></div>

  <script>
    // ========== STATE ==========
    const state = {
      currentScreen: 'home',
      stream: null,
      facingMode: 'environment',
      torchOn: false,
      docImage: null,          // HTMLImageElement or ImageBitmap
      annotations: [],         // {type, x, y, w, h, data, rotation}
      selectedStamp: null,
      signatureDataUrl: null,
      filter: 'none',          // none | grayscale | contrast | bw
      rotation: 0,
      isPlacing: null,         // 'signature' | 'stamp' | null
      placingSize: 180
    };

    // ========== DOM ==========
    const $ = (sel) => document.querySelector(sel);
    const screens = {
      home: $('#home'),
      scanner: $('#scanner'),
      editor: $('#editor')
    };
    const video = $('#video');
    const mainCanvas = $('#mainCanvas');
    const ctx = mainCanvas.getContext('2d');
    const canvasWrap = $('#canvasWrap');
    const emptyState = $('#emptyState');

    // ========== NAV ==========
    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
      state.currentScreen = name;
      if (name !== 'scanner' && state.stream) stopCamera();
    }

    // ========== TOAST ==========
    function toast(msg, ms = 2200) {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), ms);
    }

    // ========== CAMERA ==========
    async function startCamera() {
      try {
        if (state.stream) stopCamera();
        const constraints = {
          video: {
            facingMode: state.facingMode,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        state.stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = state.stream;
        await video.play();
      } catch (err) {
        console.error(err);
        toast('Camera access denied or unavailable');
        showScreen('home');
      }
    }

    function stopCamera() {
      if (state.stream) {
        state.stream.getTracks().forEach(t => t.stop());
        state.stream = null;
      }
      video.srcObject = null;
    }

    async function toggleTorch() {
      if (!state.stream) return;
      const track = state.stream.getVideoTracks()[0];
      const caps = track.getCapabilities?.();
      if (caps && caps.torch) {
        state.torchOn = !state.torchOn;
        await track.applyConstraints({ advanced: [{ torch: state.torchOn }] });
        toast(state.torchOn ? 'Flash on' : 'Flash off');
      } else {
        toast('Flash not available');
      }
    }

    function captureFrame() {
      if (!video.videoWidth) return;
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const c = canvas.getContext('2d');
      c.drawImage(video, 0, 0);
      const img = new Image();
      img.onload = () => {
        state.docImage = img;
        state.annotations = [];
        state.rotation = 0;
        state.filter = 'none';
        stopCamera();
        showScreen('editor');
        renderDocument();
        toast('Document captured');
      };
      img.src = canvas.toDataURL('image/jpeg', 0.92);
    }

    // ========== DOCUMENT RENDER ==========
    function renderDocument() {
      if (!state.docImage) {
        mainCanvas.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';
      mainCanvas.style.display = 'block';

      const img = state.docImage;
      const maxW = canvasWrap.clientWidth - 24;
      const maxH = canvasWrap.clientHeight - 24;

      let iw = img.naturalWidth || img.width;
      let ih = img.naturalHeight || img.height;

      // Apply rotation dimensions
      const rot = state.rotation % 360;
      if (rot === 90 || rot === 270) {
        [iw, ih] = [ih, iw];
      }

      const scale = Math.min(maxW / iw, maxH / ih, 1);
      const dw = Math.round(iw * scale);
      const dh = Math.round(ih * scale);

      mainCanvas.width = dw;
      mainCanvas.height = dh;

      ctx.save();
      ctx.clearRect(0, 0, dw, dh);

      // Center + rotate
      ctx.translate(dw / 2, dh / 2);
      ctx.rotate((state.rotation * Math.PI) / 180);

      const drawW = (rot === 90 || rot === 270) ? dh : dw;
      const drawH = (rot === 90 || rot === 270) ? dw : dh;

      // Filters
      if (state.filter === 'grayscale') {
        ctx.filter = 'grayscale(1)';
      } else if (state.filter === 'contrast') {
        ctx.filter = 'contrast(1.25) brightness(1.05)';
      } else if (state.filter === 'bw') {
        ctx.filter = 'grayscale(1) contrast(1.8)';
      } else {
        ctx.filter = 'none';
      }

      ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
      ctx.filter = 'none';
      ctx.restore();

      // Draw annotations (in screen space)
      state.annotations.forEach(ann => {
        ctx.save();
        if (ann.type === 'signature' || ann.type === 'stamp') {
          const aimg = new Image();
          aimg.src = ann.data;
          // We need to ensure image is loaded; for simplicity redraw when ready
          if (aimg.complete) {
            ctx.drawImage(aimg, ann.x, ann.y, ann.w, ann.h);
          } else {
            aimg.onload = () => renderDocument();
          }
        } else if (ann.type === 'text') {
          ctx.font = `${ann.fontSize || 22}px Inter, sans-serif`;
          ctx.fillStyle = ann.color || '#111';
          ctx.fillText(ann.text, ann.x, ann.y);
        }
        ctx.restore();
      });
    }

    // ========== SIGNATURE ==========
    let signaturePad = null;

    function openSignaturePad() {
      const modal = $('#sigModal');
      modal.classList.add('open');
      const canvas = $('#sigCanvas');
      // High DPI
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext('2d').scale(ratio, ratio);
      if (signaturePad) signaturePad.clear();
      signaturePad = new SignaturePad(canvas, {
        backgroundColor: 'rgb(255,255,255)',
        penColor: 'rgb(0, 20, 80)',
        minWidth: 1.2,
        maxWidth: 3.2
      });
      if (state.signatureDataUrl) {
        signaturePad.fromDataURL(state.signatureDataUrl);
      }
    }

    function closeSignaturePad() {
      $('#sigModal').classList.remove('open');
    }

    function saveSignature() {
      if (signaturePad.isEmpty()) {
        toast('Please draw a signature');
        return;
      }
      state.signatureDataUrl = signaturePad.toDataURL('image/png');
      closeSignaturePad();
      // Enter place mode
      state.isPlacing = 'signature';
      toast('Tap on the document to place signature');
      // Visual hint
      mainCanvas.style.cursor = 'crosshair';
    }

    // ========== STAMPS ==========
    const DEFAULT_STAMPS = [
      { id: 'approved', emoji: '✅', label: 'Approved', color: '#30d158' },
      { id: 'received', emoji: '📥', label: 'Received', color: '#0a84ff' },
      { id: 'confidential', emoji: '🔒', label: 'Confidential', color: '#ff453a' },
      { id: 'paid', emoji: '💰', label: 'Paid', color: '#30d158' },
      { id: 'copy', emoji: '📋', label: 'Copy', color: '#8e8e93' },
      { id: 'urgent', emoji: '⚡', label: 'Urgent', color: '#ff9f0a' },
      { id: 'void', emoji: '⛔', label: 'VOID', color: '#ff453a' },
      { id: 'custom', emoji: '🖼️', label: 'Custom', color: '#bf5af2' }
    ];

    function buildStampGrid() {
      const grid = $('#stampGrid');
      grid.innerHTML = '';
      DEFAULT_STAMPS.forEach(s => {
        const el = document.createElement('div');
        el.className = 'stamp-item';
        el.dataset.id = s.id;
        if (s.id === 'custom' && state.selectedStamp?.id === 'custom') {
          el.innerHTML = `<img src="${state.selectedStamp.data}" alt="custom"><span class="label">Custom</span>`;
        } else {
          el.innerHTML = `<span style="font-size:32px">${s.emoji}</span><span class="label">${s.label}</span>`;
        }
        el.addEventListener('click', () => {
          document.querySelectorAll('.stamp-item').forEach(i => i.classList.remove('selected'));
          el.classList.add('selected');
          if (s.id === 'custom') {
            if (state.selectedStamp?.id === 'custom') {
              // already have
            } else {
              $('#stampInput').click();
              return;
            }
          }
          state.selectedStamp = s.id === 'custom' ? state.selectedStamp : { ...s, type: 'emoji' };
          $('#btnPlaceStamp').disabled = false;
        });
        grid.appendChild(el);
      });
    }

    function openStampSheet() {
      buildStampGrid();
      $('#stampModal').classList.add('open');
      $('#btnPlaceStamp').disabled = !state.selectedStamp;
    }

    function closeStampSheet() {
      $('#stampModal').classList.remove('open');
    }

    function createEmojiStampImage(emoji, color, size = 200) {
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const cx = c.getContext('2d');
      // Circle background
      cx.beginPath();
      cx.arc(size/2, size/2, size/2 - 4, 0, Math.PI * 2);
      cx.fillStyle = color + '22';
      cx.fill();
      cx.lineWidth = 6;
      cx.strokeStyle = color;
      cx.stroke();
      // Emoji
      cx.font = `${size * 0.45}px serif`;
      cx.textAlign = 'center';
      cx.textBaseline = 'middle';
      cx.fillText(emoji, size/2, size/2 + 4);
      return c.toDataURL('image/png');
    }

    function placeStamp() {
      if (!state.selectedStamp) return;
      closeStampSheet();
      state.isPlacing = 'stamp';
      toast('Tap on the document to place stamp');
      mainCanvas.style.cursor = 'crosshair';
    }

    // ========== INTERACTION ON CANVAS ==========
    mainCanvas.addEventListener('pointerdown', (e) => {
      if (!state.docImage || !state.isPlacing) return;
      const rect = mainCanvas.getBoundingClientRect();
      const scaleX = mainCanvas.width / rect.width;
      const scaleY = mainCanvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      if (state.isPlacing === 'signature' && state.signatureDataUrl) {
        const w = state.placingSize;
        const h = w * 0.4;
        state.annotations.push({
          type: 'signature',
          x: x - w / 2,
          y: y - h / 2,
          w, h,
          data: state.signatureDataUrl
        });
        state.isPlacing = null;
        mainCanvas.style.cursor = 'default';
        renderDocument();
        toast('Signature placed');
      } else if (state.isPlacing === 'stamp' && state.selectedStamp) {
        let dataUrl;
        if (state.selectedStamp.type === 'emoji') {
          dataUrl = createEmojiStampImage(state.selectedStamp.emoji, state.selectedStamp.color);
        } else {
          dataUrl = state.selectedStamp.data;
        }
        const size = 120;
        state.annotations.push({
          type: 'stamp',
          x: x - size / 2,
          y: y - size / 2,
          w: size,
          h: size,
          data: dataUrl
        });
        state.isPlacing = null;
        mainCanvas.style.cursor = 'default';
        renderDocument();
        toast('Stamp placed');
      }
    });

    // ========== TOOLS ==========
    document.querySelectorAll('.tool').forEach(btn => {
      btn.addEventListener('click', () => {
        const tool = btn.dataset.tool;
        if (tool === 'signature') {
          openSignaturePad();
        } else if (tool === 'stamp') {
          openStampSheet();
        } else if (tool === 'text') {
          const text = prompt('Enter text to place:');
          if (text) {
            state.isPlacing = null;
            // Simple place at center for now
            const x = mainCanvas.width / 2 - 40;
            const y = mainCanvas.height / 2;
            state.annotations.push({
              type: 'text',
              x, y,
              text,
              fontSize: 24,
              color: '#111'
            });
            renderDocument();
            toast('Text added');
          }
        } else if (tool === 'rotate') {
          state.rotation = (state.rotation + 90) % 360;
          renderDocument();
        } else if (tool === 'filter') {
          const filters = ['none', 'grayscale', 'contrast', 'bw'];
          const idx = filters.indexOf(state.filter);
          state.filter = filters[(idx + 1) % filters.length];
          renderDocument();
          toast('Filter: ' + state.filter);
        } else if (tool === 'delete') {
          if (state.annotations.length) {
            state.annotations.pop();
            renderDocument();
            toast('Last annotation removed');
          } else {
            toast('Nothing to remove');
          }
        }
      });
    });

    // ========== EXPORT ==========
    function openExport() {
      if (!state.docImage) {
        toast('No document to export');
        return;
      }
      $('#exportModal').classList.add('open');
    }

    function closeExport() {
      $('#exportModal').classList.remove('open');
    }

    function exportPNG() {
      renderDocument(); // ensure latest
      const link = document.createElement('a');
      link.download = `ScanSign-${Date.now()}.png`;
      link.href = mainCanvas.toDataURL('image/png');
      link.click();
      closeExport();
      toast('PNG saved');
    }

    function exportPDF() {
      renderDocument();
      const { jsPDF } = window.jspdf;
      const imgData = mainCanvas.toDataURL('image/jpeg', 0.95);
      const pdf = new jsPDF({
        orientation: mainCanvas.width > mainCanvas.height ? 'l' : 'p',
        unit: 'px',
        format: [mainCanvas.width, mainCanvas.height]
      });
      pdf.addImage(imgData, 'JPEG', 0, 0, mainCanvas.width, mainCanvas.height);
      pdf.save(`ScanSign-${Date.now()}.pdf`);
      closeExport();
      toast('PDF saved');
    }

    // ========== FILE IMPORT ==========
    function handleFile(file) {
      if (!file) return;
      if (file.type.startsWith('image/')) {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          state.docImage = img;
          state.annotations = [];
          state.rotation = 0;
          state.filter = 'none';
          showScreen('editor');
          renderDocument();
          URL.revokeObjectURL(url);
          toast('Image imported');
        };
        img.src = url;
      } else if (file.type === 'application/pdf') {
        toast('PDF import: open the first page as image (use a converter or screenshot for best results)');
        // Basic: we don't parse PDF fully without heavy lib; suggest image
      } else {
        toast('Unsupported file type');
      }
    }

    // ========== EVENTS ==========
    $('#btnScan').addEventListener('click', () => {
      showScreen('scanner');
      startCamera();
    });

    $('#btnCloseScanner').addEventListener('click', () => {
      stopCamera();
      showScreen('home');
    });

    $('#btnCapture').addEventListener('click', captureFrame);
    $('#btnTorch').addEventListener('click', toggleTorch);
    $('#btnSwitchCam').addEventListener('click', () => {
      state.facingMode = state.facingMode === 'environment' ? 'user' : 'environment';
      startCamera();
    });

    $('#btnImport').addEventListener('click', () => $('#fileInput').click());
    $('#btnGalleryFromCam').addEventListener('click', () => $('#fileInput').click());
    $('#fileInput').addEventListener('change', (e) => {
      handleFile(e.target.files[0]);
      e.target.value = '';
    });

    $('#btnBackEditor').addEventListener('click', () => showScreen('home'));
    $('#btnExport').addEventListener('click', openExport);

    $('#btnQuickSign').addEventListener('click', openSignaturePad);
    $('#btnQuickStamp').addEventListener('click', openStampSheet);

    $('#btnClearSig').addEventListener('click', () => signaturePad && signaturePad.clear());
    $('#btnSaveSig').addEventListener('click', saveSignature);

    $('#btnPlaceStamp').addEventListener('click', placeStamp);
    $('#btnUploadStamp').addEventListener('click', () => $('#stampInput').click());
    $('#stampInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        const max = 300;
        const sc = Math.min(max / img.width, max / img.height, 1);
        c.width = img.width * sc;
        c.height = img.height * sc;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        state.selectedStamp = {
          id: 'custom',
          type: 'image',
          data: c.toDataURL('image/png'),
          label: 'Custom'
        };
        buildStampGrid();
        document.querySelector('.stamp-item[data-id="custom"]')?.classList.add('selected');
        $('#btnPlaceStamp').disabled = false;
        URL.revokeObjectURL(url);
        toast('Custom stamp ready');
      };
      img.src = url;
      e.target.value = '';
    });

    $('#btnExportPNG').addEventListener('click', exportPNG);
    $('#btnExportPDF').addEventListener('click', exportPDF);

    // Close modals on backdrop click
    ['sigModal', 'stampModal', 'exportModal'].forEach(id => {
      $(`#${id}`).addEventListener('click', (e) => {
        if (e.target.classList.contains('modal-backdrop')) {
          e.target.classList.remove('open');
        }
      });
    });

    // Resize handler
    window.addEventListener('resize', () => {
      if (state.docImage) renderDocument();
    });

    // Prevent pull-to-refresh etc
    document.body.addEventListener('touchmove', (e) => {
      if (e.target.closest('.sheet') || e.target.closest('#sigCanvas')) return;
      // allow only inside scrollable sheets
    }, { passive: true });

    // Init
    buildStampGrid();
    console.log('ScanSign ready — iOS Liquid Glass style');
  </script>
</body>
</html>
